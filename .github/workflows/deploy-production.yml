name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Run deterministic four-layer smoke eval
        run: bash eval/run-deterministic-evals.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          set -o pipefail
          if ! yarn install --frozen-lockfile 2>&1 | tee /tmp/yarn-install.log; then
            {
              echo "### yarn install 失败输出"
              echo '```'
              tail -120 /tmp/yarn-install.log
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi

      - name: Lint frontend
        working-directory: frontend
        run: yarn lint

      - name: Test frontend
        working-directory: frontend
        run: yarn test

      - name: Build frontend
        working-directory: frontend
        run: yarn build
