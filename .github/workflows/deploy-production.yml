name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and package backend
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Create release archive
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          mkdir -p release/backend release/frontend
          mapfile -t backend_jars < <(find target -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ ${#backend_jars[@]} -ne 1 ]]; then
            printf '预期生成一个可执行 JAR，实际找到 %s 个\n' "${#backend_jars[@]}" >&2
            exit 1
          fi
          cp "${backend_jars[0]}" release/backend/zhihai.jar
          cp -R frontend/dist/. release/frontend/
          printf '%s\n' "$RELEASE_ID" > release/REVISION
          tar -czf "zhihai-${RELEASE_ID}.tar.gz" -C release .

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName ${DEPLOY_HOST}
            Port ${DEPLOY_PORT:-22}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: scp "zhihai-${RELEASE_ID}.tar.gz" production:/tmp/

      - name: Deploy and verify
        env:
          RELEASE_ID: ${{ github.sha }}
        run: ssh production "sudo /usr/local/sbin/deploy-zhihai '/tmp/zhihai-${RELEASE_ID}.tar.gz' '${RELEASE_ID}'"
