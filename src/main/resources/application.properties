spring.application.name=my-knowledge-assistant
server.port=8080

# 仅暴露运行所需端点；健康详情不向未认证请求公开，避免泄露依赖和环境信息。
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.server.address=${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,chroma

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.user.avatar-directory=${AVATAR_DIRECTORY:data/avatars}
app.eval.import-directory=${EVAL_IMPORT_DIRECTORY:data/eval-imports}
app.files.allowed-directories=${FILE_ALLOWED_DIRECTORIES:data,docs}
app.files.max-read-bytes=${FILE_MAX_READ_BYTES:10485760}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.logging.instance-id=${INSTANCE_ID:unknown}
app.logging.environment=${APP_ENVIRONMENT:development}

# 邮箱验证码邮件发送；SMTP 参数通过环境变量注入，未配置 host 时回退为日志打印验证码（开发模式）。
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:true}
app.mail.verification.code-ttl-minutes=${MAIL_CODE_TTL_MINUTES:10}
app.mail.verification.resend-seconds=${MAIL_RESEND_SECONDS:60}
app.mail.verification.ip-window-minutes=${MAIL_IP_WINDOW_MINUTES:60}
app.mail.verification.max-attempts=${MAIL_CODE_MAX_ATTEMPTS:5}
app.mail.verification.max-ip-sends=${MAIL_MAX_IP_SENDS:10}
# 旧版管理员账号迁移清单：应用启动时一次性将这些存量账号写为数据库 ADMIN 角色。
app.security.admin-accounts=${ADMIN_ACCOUNTS:}

# 知识库未命中时使用已配置的大模型回答。真实联网搜索需接入搜索服务后再显式开启。
workbench.rag.model-fallback.enabled=true
workbench.rag.web-search.enabled=false
# 向量召回后由大模型严格筛选可直接支持答案的候选；无法确认相关时转入通用模型且不返回本地来源。
workbench.rag.quality-gate.enabled=true
# 流式回答完成后异步记录质量信号，不影响首 token；开启 quality-gate 后可额外进行 LLM 依据校验。
workbench.rag.async-quality.enabled=true
# 在线聊天优先低延迟，先用原问题执行混合检索；评测的“增强检索”仍可显式开启改写和多查询。
workbench.rag.query-rewrite.enabled=false
workbench.rag.multi-query.enabled=false
workbench.rag.multi-query.max-queries=3
# Chroma 返回 BGE-M3 归一化向量的 L2 距离；实测直接相关 PDF 页约为 0.64，0.45 会造成误杀。
workbench.rag.similarity-threshold=0.85
workbench.rag.score-direction=distance
# 第一版混合检索使用 PostgreSQL 稀疏索引和 RRF，不依赖 Elasticsearch。
workbench.rag.hybrid.enabled=true
workbench.rag.hybrid.rrf-k=60
# 宽泛主题常跨越多个 PDF 页；在总 token 预算内保留同一文档的相关块和相邻页。
workbench.rag.context.max-tokens=4500
workbench.rag.context.max-chunks-per-document=5
workbench.rag.context.adjacent-enabled=true

# 离线评测门禁默认关闭，CI 或命令行真实模型评测按需显式开启。
workbench.eval.gate.enabled=${WORKBENCH_EVAL_GATE_ENABLED:false}
workbench.eval.gate.min-pass-rate=${WORKBENCH_EVAL_GATE_MIN_PASS_RATE:0.8}
workbench.eval.gate.min-recall-at-5=${WORKBENCH_EVAL_GATE_MIN_RECALL_AT_5:0.8}
workbench.eval.gate.min-mrr=${WORKBENCH_EVAL_GATE_MIN_MRR:0.7}
workbench.eval.gate.max-unsupported-answer-rate=${WORKBENCH_EVAL_GATE_MAX_UNSUPPORTED_ANSWER_RATE:0.05}
workbench.eval.run.max-cases=${WORKBENCH_EVAL_RUN_MAX_CASES:100}

# 扫描 PDF 和图片 OCR。生产环境需安装 tesseract、tesseract-ocr-chi-sim 和英文语言包。
workbench.ocr.command=${OCR_COMMAND:tesseract}
workbench.ocr.languages=${OCR_LANGUAGES:chi_sim+eng}
workbench.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:120}
workbench.ocr.max-concurrent=${OCR_MAX_CONCURRENT:2}
workbench.ocr.max-output-bytes=${OCR_MAX_OUTPUT_BYTES:2097152}
workbench.ocr.watermark-lightness-threshold=${OCR_WATERMARK_LIGHTNESS_THRESHOLD:215}
workbench.ocr.max-pages=${OCR_MAX_PAGES:5000}
workbench.pdf.batch-pages=${PDF_BATCH_PAGES:50}
workbench.ocr.max-ocr-pages=${OCR_MAX_OCR_PAGES:50}
workbench.ocr.max-page-width-points=${OCR_MAX_PAGE_WIDTH_POINTS:14400}
workbench.ocr.max-page-height-points=${OCR_MAX_PAGE_HEIGHT_POINTS:14400}
workbench.ocr.max-pixels=${OCR_MAX_PIXELS:25000000}

workbench.eval.import.xlsx.max-entries=${EVAL_XLSX_MAX_ENTRIES:1000}
workbench.eval.import.xlsx.max-entry-bytes=${EVAL_XLSX_MAX_ENTRY_BYTES:10485760}
workbench.eval.import.xlsx.max-total-bytes=${EVAL_XLSX_MAX_TOTAL_BYTES:52428800}
workbench.eval.import.xlsx.max-rows=${EVAL_XLSX_MAX_ROWS:10000}
workbench.eval.import.max-cases=${EVAL_IMPORT_MAX_CASES:500}

# Spring AI 默认也会重试 5xx。关闭其重试，由 LocalChatClient 统一控制请求预算。
spring.ai.retry.max-attempts=1
app.ai.request-timeout-ms=${AI_REQUEST_TIMEOUT_MS:60000}
app.ai.fallback-request-timeout-ms=${AI_FALLBACK_REQUEST_TIMEOUT_MS:90000}

app.mcp.enabled=false
app.mcp.server-url=

spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=deepseek-ai/DeepSeek-V4-Flash
spring.ai.openai.embedding.base-url=https://api.siliconflow.cn
spring.ai.openai.embedding.api-key=${OPENAI_EMBEDDING_API_KEY}
spring.ai.openai.embedding.options.model=BAAI/bge-m3

spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://175.178.229.209}
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.tenant-name=default_tenant
spring.ai.vectorstore.chroma.database-name=default_database
spring.ai.vectorstore.chroma.collection-name=knowledge_assistant
spring.ai.vectorstore.chroma.initialize-schema=true
