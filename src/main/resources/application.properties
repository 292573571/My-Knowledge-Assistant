spring.application.name=my-knowledge-assistant
server.port=8080

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.user.avatar-directory=${AVATAR_DIRECTORY:data/avatars}
app.eval.import-directory=${EVAL_IMPORT_DIRECTORY:data/eval-imports}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
# 旧版管理员账号迁移清单：应用启动时一次性将这些存量账号写为数据库 ADMIN 角色。
app.security.admin-accounts=${ADMIN_ACCOUNTS:}

app.ai.provider=openai-compatible
app.ai.model=DeepSeek V4 Flash
# 主模型超时或服务端失败时，自动切换到备用模型，避免直接返回安全失败提示。
app.ai.fallback-models=Qwen/Qwen2.5-7B-Instruct
# 主模型快速尝试，响应慢时尽早切换备用模型，避免用户长时间空等。
app.ai.request-timeout-ms=20000
app.ai.fallback-request-timeout-ms=45000
app.ai.retry.max-attempts=1
app.ai.retry.backoff-ms=500
app.ai.fallback-strategy=local-answer
# 学习问答优先保证相同问题的回答稳定一致。
app.ai.temperature=0

# 知识库未命中时使用已配置的大模型回答。真实联网搜索需接入搜索服务后再显式开启。
workbench.rag.model-fallback.enabled=true
workbench.rag.web-search.enabled=false
# 向量召回后由大模型严格筛选可直接支持答案的候选；无法确认相关时转入通用模型且不返回本地来源。
workbench.rag.quality-gate.enabled=true
# 流式回答完成后异步记录质量信号，不影响首 token；开启 quality-gate 后可额外进行 LLM 依据校验。
workbench.rag.async-quality.enabled=true
# 查询改写和多查询会额外请求模型，用于提升口语化问题和同义表达的召回覆盖率。
workbench.rag.query-rewrite.enabled=true
workbench.rag.multi-query.enabled=true
workbench.rag.multi-query.max-queries=3
# Chroma 返回 BGE-M3 归一化向量的 L2 距离；实测直接相关 PDF 页约为 0.64，0.45 会造成误杀。
workbench.rag.similarity-threshold=0.85
workbench.rag.score-direction=distance

# 扫描 PDF 和图片 OCR。生产环境需安装 tesseract、tesseract-ocr-chi-sim 和英文语言包。
workbench.ocr.command=${OCR_COMMAND:tesseract}
workbench.ocr.languages=${OCR_LANGUAGES:chi_sim+eng}
workbench.ocr.timeout-seconds=${OCR_TIMEOUT_SECONDS:120}
workbench.ocr.watermark-lightness-threshold=${OCR_WATERMARK_LIGHTNESS_THRESHOLD:215}

# Spring AI 默认也会重试 5xx。关闭其重试，由 LocalChatClient 统一控制请求预算。
spring.ai.retry.max-attempts=1

app.mcp.enabled=false
app.mcp.server-url=

spring.ai.openai.base-url=https://api.siliconflow.cn
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.base-url=https://api.siliconflow.cn
spring.ai.openai.chat.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=deepseek-ai/DeepSeek-V4-Flash
spring.ai.openai.embedding.base-url=https://api.siliconflow.cn
spring.ai.openai.embedding.api-key=${OPENAI_EMBEDDING_API_KEY}
spring.ai.openai.embedding.options.model=BAAI/bge-m3
spring.ai.openai.embedding.model=BAAI/bge-m3

spring.ai.vectorstore.chroma.client.host=http://175.178.229.209
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.tenant-name=default_tenant
spring.ai.vectorstore.chroma.database-name=default_database
spring.ai.vectorstore.chroma.collection-name=knowledge_assistant
spring.ai.vectorstore.chroma.initialize-schema=true
